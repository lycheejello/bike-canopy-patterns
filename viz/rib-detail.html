<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grub bike — rib / standoff detail</title>
<style>
  html,body { margin:0; height:100%; background:#0b0d10; color:#cdd6e0; font:13px/1.5 ui-monospace,Menlo,monospace; overflow:hidden; }
  #hud { position:fixed; top:10px; left:10px; z-index:10; background:rgba(12,14,18,.86);
         border:1px solid #2a313c; border-radius:8px; padding:10px 12px; max-width:300px; }
  #hud h1 { font-size:13px; margin:0 0 6px; color:#8fd6a0; }
  #sliders label { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #sliders label span:first-child { width:88px; color:#7d8794; }
  #sliders input { flex:1; }
  #sliders label span:last-child { width:48px; text-align:right; color:#8fd6a0; }
  #hud button { font:inherit; background:#1a212b; color:#cdd6e0; border:1px solid #2f3a47; border-radius:6px; padding:4px 8px; margin:2px 4px 6px 0; cursor:pointer; }
  #hud button.on { background:#2b6a44; border-color:#3c8a5b; color:#eafff0; }
  #readout { border-top:1px solid #2a313c; margin-top:8px; padding-top:6px; color:#9fb0c2; font-size:11px; white-space:pre-line; }
  #hud .note { color:#6b7480; margin-top:8px; font-size:11px; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="hud">
  <h1>RIB DETAIL — one hoop station</h1>
  <div id="picker"></div>
  <div id="sliders"></div>
  <div id="readout"></div>
  <div class="note">Cross-section looking head→tail. The hoop is the cloth former (270°
    cut for belly clearance); each stringer stands off inboard by the gap on a standoff
    and carries an LED strip facing out. Slide <b>station</b> from head (t=0) through the
    mid-body bulge (t=0.5) to tail.</div>
</div>
<canvas id="cv"></canvas>
<script>
// ─── geometry — keep in sync with tools/gen-map.mjs ───────────────────────
const STRINGERS=8, BOTTOM_GAP=90, arc=360-BOTTOM_GAP;
const angleOf = s => (90 - arc/2 + (s/(STRINGERS-1))*arc) * Math.PI/180;
const GRUBS = { parent:{label:"Parent (L)",rEnd:6,rMid:14,len:72}, baby:{label:"Baby (XS)",rEnd:5,rMid:11,len:60} };
const radiusAt = (t,g) => g.rEnd + (g.rMid-g.rEnd)*Math.sin(Math.PI*t);

const P = { station:0.5, gap:3.5 };
let key='parent';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');

function draw(){
  const g=GRUBS[key];
  const W=cv.width=innerWidth, H=cv.height=innerHeight;
  ctx.clearRect(0,0,W,H);
  const rHoop=radiusAt(P.station,g), rStr=rHoop-P.gap;
  // screen: y-up, centre lower-third so the open belly + bike read
  const cx=W/2, cy=H*0.46;
  const scale=Math.min(W,H)*0.42/g.rMid;     // fit max radius
  const SX=(r,a)=>cx + r*Math.cos(a)*scale;
  const SY=(r,a)=>cy - r*Math.sin(a)*scale;

  // ground + bike-in-belly schematic
  ctx.strokeStyle='#1c2430'; ctx.lineWidth=1;
  for (let i=0;i<=20;i++){ const y=cy+ i*scale*1.0 - scale*0; }  // (grid omitted, keep clean)
  ctx.strokeStyle='#3a4654'; ctx.lineWidth=2;
  const groundY=SY(0,0)+ (g.rMid+ (key==='parent'?9:7))*scale*0; // belly sits ~ rMid above ground; draw ground below
  // simple bike frame box in the open belly
  ctx.strokeStyle='#8a939e'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-6*scale, cy+6*scale); ctx.lineTo(cx, cy- (g.rEnd*0)*scale);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy+ (g.rMid*0.55)*scale, 1.0*scale, 0, 7); ctx.stroke(); // BB
  ctx.fillStyle='#5b6470'; ctx.font='11px ui-monospace'; ctx.fillText('bike frame / wheel / legs', cx-58, cy+(g.rMid*0.75)*scale);

  const a0=angleOf(0), a1=angleOf(STRINGERS-1);

  // cloth (just outside hoop) — translucent fill arc
  ctx.beginPath();
  for (let i=0;i<=80;i++){ const a=a0+(a1-a0)*i/80, r=rHoop+0.4; const x=SX(r,a), y=SY(r,a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.strokeStyle='#dfe9f5'; ctx.lineWidth=6; ctx.globalAlpha=0.18; ctx.stroke(); ctx.globalAlpha=1;
  ctx.strokeStyle='#aebfd2'; ctx.lineWidth=1.2; ctx.stroke();

  // hoop rib (270° arc)
  ctx.beginPath();
  for (let i=0;i<=80;i++){ const a=a0+(a1-a0)*i/80; const x=SX(rHoop,a), y=SY(rHoop,a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.strokeStyle='#4caf6a'; ctx.lineWidth=3; ctx.stroke();

  // standoffs + stringers + LEDs
  for (let s=0;s<STRINGERS;s++){ const a=angleOf(s);
    // standoff strut hoop->stringer
    ctx.beginPath(); ctx.moveTo(SX(rHoop,a),SY(rHoop,a)); ctx.lineTo(SX(rStr,a),SY(rStr,a));
    ctx.strokeStyle='#c25b5b'; ctx.lineWidth=2.5; ctx.stroke();
    // stringer node (PVC) + LED facing out
    ctx.fillStyle='#e0a84e'; ctx.beginPath(); ctx.arc(SX(rStr,a),SY(rStr,a),4,0,7); ctx.fill();
    ctx.fillStyle='#fff2c8'; ctx.beginPath(); ctx.arc(SX(rStr+0.5,a),SY(rStr+0.5,a),2.4,0,7); ctx.fill();
  }

  // gap dimension on the top stringer
  const at=Math.PI/2;
  ctx.strokeStyle='#7d8794'; ctx.setLineDash([4,3]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(SX(rStr,at)+14,SY(rStr,at)); ctx.lineTo(SX(rHoop,at)+14,SY(rHoop,at)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#9fb0c2'; ctx.fillText(`gap ${P.gap}"`, SX(rHoop,at)+20, (SY(rStr,at)+SY(rHoop,at))/2);

  // radius callout
  ctx.strokeStyle='#39424f'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(SX(rHoop,a0),SY(rHoop,a0)); ctx.stroke();
  ctx.fillStyle='#5b6470'; ctx.fillText(`Ø ${(2*rHoop).toFixed(0)}"`, cx+6, cy-6);

  // belly-gap angle marker
  ctx.fillStyle='#6b7480'; ctx.fillText('open belly 90°', cx-34, cy+(rHoop*0.9)*scale);

  document.getElementById('readout').textContent =
    `station t=${P.station.toFixed(2)}  (z=${(P.station*g.len).toFixed(0)}")\n`+
    `hoop Ø ${(2*rHoop).toFixed(1)}"  ·  stringer ring Ø ${(2*rStr).toFixed(1)}"\n`+
    `standoff height = ${P.gap}"  ×8 per rib\n`+
    `LED arc spacing here ≈ ${( (rStr*(a1-a0))/(STRINGERS-1) ).toFixed(1)}" between stringers`;
  document.querySelectorAll('#picker button').forEach(x=>x.classList.toggle('on',x.dataset.k===key));
}

const picker=document.getElementById('picker');
for (const k of Object.keys(GRUBS)){ const b=document.createElement('button'); b.textContent=GRUBS[k].label; b.dataset.k=k; b.onclick=()=>{key=k;draw();}; picker.appendChild(b); }

const SLIDERS=[['station','station',0,1,0.01],['gap','gap',1,6,0.25]];
const slBox=document.getElementById('sliders');
for (const [label,k,min,max,step] of SLIDERS){
  const l=document.createElement('label');
  const s1=document.createElement('span'); s1.textContent=label;
  const inp=document.createElement('input'); inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=P[k];
  const s2=document.createElement('span'); s2.textContent=P[k];
  inp.oninput=()=>{ P[k]=parseFloat(inp.value); s2.textContent=P[k]; draw(); };
  l.append(s1,inp,s2); slBox.appendChild(l);
}
addEventListener('resize',draw); draw();
</script>
</body>
</html>
